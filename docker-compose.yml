services:
   nuxt:
      build:
         context: .
         dockerfile: Dockerfile
      container_name: nuxt-app
      ports:
         - '3000:3000'
      volumes:
         - .:/app
         - /app/.nuxt
      depends_on:
         - postgres
      env_file:
         - .env

   postgres:
      image: postgres:18-alpine
      container_name: postgres-db
      restart: always
      env_file:
         - .env
      ports:
         - '5434:5432'
      volumes:
         - postgres_data:/var/lib/postgresql/data

volumes:
   postgres_data:
